# =============================================================================
# Strategos — CI Build & Test
#
# Triggers: push/PR to master or main, plus manual dispatch.
#
# Required GitHub Secrets (Settings → Secrets → Actions):
#   UNITY_LICENSE   — XML content of your Unity license file.
#                     Obtain via: Unity Editor → Help → Manage License →
#                     Activate New License → Save License File.
#                     Then run: cat Unity_v6000.x.ulf | base64  (store decoded)
#   UNITY_EMAIL     — Your Unity account email
#   UNITY_PASSWORD  — Your Unity account password
#
# Without those secrets there is no way to activate the editor, so both the test
# and build jobs would fail on activation alone — a red check that says nothing
# about the code. `preflight` therefore probes for credentials and the Unity jobs
# skip when none are present, which reports neutral rather than failed.
#
# Jobs:
#   preflight — Reports whether Unity credentials are configured.
#   test      — Runs Unity EditMode tests and uploads NUnit XML results.
#   build     — Builds Windows, Linux, and macOS in parallel.
#
# `build` deliberately does NOT depend on `test`: there is no test assembly under
# Assets/ yet, so gating releases on an empty test run only adds a failure mode.
# Restore `needs: test` once real tests exist.
# =============================================================================

name: CI — Build & Test

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:   # Allows manual trigger from the GitHub Actions UI

concurrency:
  # Cancel any in-progress run on the same branch/PR when a new one starts.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  UNITY_VERSION: 6000.0.75f1
  PROJECT_PATH: .

# =============================================================================
# Job 1 — Preflight
#
# The `secrets` context is not available in a job-level `if`, so presence has to
# be probed inside a step and published as an output for the Unity jobs to read.
# =============================================================================
jobs:
  preflight:
    name: Preflight
    runs-on: ubuntu-latest

    outputs:
      unity-credentials: ${{ steps.probe.outputs.unity-credentials }}

    steps:
      - name: Probe for Unity credentials
        id: probe
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          # A license file alone is enough; so is an email/password pair.
          if [ -n "$UNITY_LICENSE" ] || { [ -n "$UNITY_EMAIL" ] && [ -n "$UNITY_PASSWORD" ]; }; then
            echo "unity-credentials=true" >> "$GITHUB_OUTPUT"
            echo "Unity credentials found — test and build jobs will run."
          else
            echo "unity-credentials=false" >> "$GITHUB_OUTPUT"
            echo "::warning title=Unity credentials missing::UNITY_LICENSE (or UNITY_EMAIL + UNITY_PASSWORD) is not set, so the Unity test and build jobs were skipped. Set them under Settings → Secrets → Actions to enable CI builds."
          fi

# =============================================================================
# Job 2 — Test
# =============================================================================
  test:
    name: Tests (EditMode)
    runs-on: ubuntu-latest
    needs: preflight
    if: needs.preflight.outputs.unity-credentials == 'true'

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ── Cache Library ───────────────────────────────────────────────────────
      - name: Cache Unity Library
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-Test-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Test-
            Library-

      # ── Run tests ───────────────────────────────────────────────────────────
      - name: Run EditMode tests
        uses: game-ci/unity-test-runner@v4
        id: tests
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath:    ${{ env.PROJECT_PATH }}
          unityVersion:   ${{ env.UNITY_VERSION }}
          testMode:       EditMode
          artifactsPath:  TestResults
          githubToken:    ${{ secrets.GITHUB_TOKEN }}
          checkName:      EditMode Test Results

      # ── Upload test results ─────────────────────────────────────────────────
      - name: Upload test results
        uses: actions/upload-artifact@v4
        if: always()   # Upload even on test failure so failures are inspectable
        with:
          name: TestResults
          path: ${{ steps.tests.outputs.artifactsPath }}
          retention-days: 14

# =============================================================================
# Job 3 — Build matrix
# =============================================================================
  build:
    name: Build — ${{ matrix.platform.name }}
    runs-on: ubuntu-latest
    needs: preflight     # Not `test` — see the header note on the empty test suite
    if: needs.preflight.outputs.unity-credentials == 'true'

    strategy:
      fail-fast: false   # Let all platforms finish even if one fails
      matrix:
        platform:
          - name:        Windows
            unityTarget: StandaloneWindows64
            buildMethod: Strategos.Editor.GameBuild.BuildWindows

          - name:        Linux
            unityTarget: StandaloneLinux64
            buildMethod: Strategos.Editor.GameBuild.BuildLinux

          - name:        macOS
            unityTarget: StandaloneOSX
            buildMethod: Strategos.Editor.GameBuild.BuildMacOS

    steps:
      # ── Checkout ────────────────────────────────────────────────────────────
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      # ── Cache Library (per-platform to avoid cross-contamination) ───────────
      - name: Cache Unity Library (${{ matrix.platform.name }})
        uses: actions/cache@v4
        with:
          path: Library
          key: Library-${{ matrix.platform.name }}-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-${{ matrix.platform.name }}-
            Library-

      # ── Build ────────────────────────────────────────────────────────────────
      - name: Build ${{ matrix.platform.name }}
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE:  ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL:    ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          projectPath:    ${{ env.PROJECT_PATH }}
          unityVersion:   ${{ env.UNITY_VERSION }}
          targetPlatform: ${{ matrix.platform.unityTarget }}
          buildName:      Strategos
          buildsPath:     Artifacts
          buildMethod:    ${{ matrix.platform.buildMethod }}

      # ── Upload build artifact ────────────────────────────────────────────────
      - name: Upload ${{ matrix.platform.name }} artifact
        uses: actions/upload-artifact@v4
        with:
          name:              Strategos-${{ matrix.platform.name }}-${{ github.sha }}
          path:              Artifacts/${{ matrix.platform.unityTarget }}
          retention-days:    7
          if-no-files-found: error
